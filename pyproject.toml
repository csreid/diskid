[project]
name = "diskid"
version = "0.1.0"
description = "Identify TV episodes in ripped video files via subtitle fingerprinting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "scikit-learn>=1.9.0",
    "tqdm>=4.68.4",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.2.1"]

[project.scripts]
diskid = "diskid.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "faster-whisper>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diskid"]
